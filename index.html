<h1>piyo-metrics</h1>
<p>piyo-metrics は、運営者が自分の YouTube チャンネルの集計値（視聴時間・登録者数の増減、再生回数・高評価などの反応、動画別・流入元別の内訳）を週に1回読み取り、運営者自身の記録に残すための個人用ツールです。YouTube API サービスを利用しています。</p>
<p>一般の利用者向けのサービスではありません。</p>
